services:
  api:
    image: html-analyzer:latest
    build: 
      context: .
      dockerfile: docker/api/Dockerfile 
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__Db: Host=postgres;Port=5432;Database=html_analyzer_db;Username=postgres;Password=postgres
    ports: 
      - 8090:8080
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: html_analyzer_db

    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql 

volumes:
  postgres-data: 


